name: Filter Future Entries

on:
  push:
    branches: [source]
  schedule:
    # Runs every day at 00:05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Filter entries to tomorrow max
        run: |
          TOMORROW=$(date -u -d "+1 day" +%Y-%m-%d)
          echo "Filtering entries up to: $TOMORROW"

          for file in inphoria*.json; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              python3 -c "
          import json

          tomorrow = '$TOMORROW'

          with open('$file', 'r') as f:
              entries = json.load(f)

          filtered = [e for e in entries if e.get('date', '') <= tomorrow or e.get('date', '') == 'default']

          print(f'  {len(entries)} entries -> {len(filtered)} entries (up to {tomorrow})')

          with open('$file', 'w') as f:
              json.dump(filtered, f, indent=2, ensure_ascii=False)
          "
            fi
          done

      - name: Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force update main with the filtered content
          git add -A
          git commit -m "Update filtered entries for $(date -u +%Y-%m-%d)" || echo "No changes"
          git push origin HEAD:main --force
